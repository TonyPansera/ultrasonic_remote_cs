[project]
name = "barlab"
version = "0.1.0"
description = "Deterministic DSP for ultrasonic bar-impact recordings: impact segmentation, ringdown spectra, decay fits, bar-mode theory."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "matplotlib>=3.8",
]

[project.scripts]
barlab = "barlab.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["barlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
