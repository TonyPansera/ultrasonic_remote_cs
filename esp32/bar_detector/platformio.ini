; Bar detector for the LilyGO T-Display v1.1: tells the ~40 kHz bar from the ~50 kHz bar on GPIO32.
; TFT_eSPI is configured entirely through build flags (pins from Setup25_TTGO_T_Display.h),
; so the library itself never needs editing.
;   pio run                 build the firmware (env tdisplay)
;   pio run -t upload       flash it (board attached as /dev/ttyACM0)
;   pio test -e native      run the detector tests on this PC (no board needed)

[platformio]
default_envs = tdisplay

[env:tdisplay]
platform = espressif32
board = lilygo-t-display
framework = arduino
monitor_speed = 921600
upload_speed = 921600
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
lib_deps = bodmer/TFT_eSPI@^2.5.43
build_flags =
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=135
  -DTFT_HEIGHT=240
  -DCGRAM_OFFSET=1
  -DTFT_MOSI=19
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=16
  -DTFT_RST=23
  -DTFT_BL=4
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=6000000
  -DDISABLE_ALL_LIBRARY_WARNINGS=1

; Host build of lib/tone_detector for the unit tests in test/ (synthetic signals + data/raw/rec4|5.wav).
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -O2 -Wall
